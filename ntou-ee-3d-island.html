const v=rad(60*k);for(const sg of[1,-1])add(new THREE.CylinderGeometry(.18,.18,1,6),0x7a5230,dx*m+dz*1.6*sg,1,dz*m-dx*1.6*sg);
add(new THREE.CylinderGeometry(.2,.3,1.2,6),0x7a5230,Math.sin(v)*8.6,1.1,Math.cos(v)*8.6);add(new THREE.ConeGeometry(1.2,2.8,7),0x2f8f4e,Math.sin(v)*8.6,3.1,Math.cos(v)*8.6)}
function person(shirt,hair=0x3b2a20){const g=new THREE.Group();add(new THREE.CylinderGeometry(.55,.65,1.4,10),shirt,0,1.2,0,g);add(new THREE.SphereGeometry(.5,14,12),0xffd9b8,0,2.3,0,g);add(new THREE.SphereGeometry(.53,14,8,0,6.28,0,1.6),hair,0,2.35,0,g);g.userData.shirt=g.children[0];add(new THREE.BoxGeometry(.12,.12,.1),0x222222,-.17,2.35,.46,g);add(new THREE.BoxGeometry(.12,.12,.1),0x222222,.17,2.35,.46,g);S.add(g);return g}
const chair=person(0x1f4e79,0x9aa0a8);chair.position.set(-4,0,-3);chair.scale.setScalar(1.15);
const lc=label('譚仕煒（系主任）',.8,9);lc.position.set(-4,4.6,-3);S.add(lc);
const me=person(YC[0]);me.position.set(0,0,5);
const mlab=label('大一',.45);mlab.position.y=3.5;me.add(mlab);
function setAvatar(){me.userData.shirt.material.color.set(YC[yr]);const c=mlab.material.map.image,x=c.getContext('2d');x.clearRect(0,0,512,128);x.font='bold 54px sans-serif';x.textAlign='center';x.lineWidth=10;x.strokeStyle='#0b4a66';x.strokeText(YN[yr],256,80);x.fillStyle='#fff';x.fillText(YN[yr],256,80);mlab.material.map.needsUpdate=true;document.querySelectorAll('#hud [data-a]').forEach((b,i)=>b.setAttribute('aria-pressed',i===yr))}
$('#hud').innerHTML=YN.map((n,i)=>`<button aria-pressed="${i===0}" data-a="${i}">${n}</button>`).join('')+'<button data-go="1">回中央</button>';
$('#hud').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a){yr=+b.dataset.a;setAvatar();if(cur===Z[0])req()}else{me.position.set(0,0,5);stopGo()}};
// ---- walkable: hex islands + bridges
const inHex=(x,z,cx,cz,ap)=>{for(let j=0;j<6;j++){const [a,b]=DIR(j);if((x-cx)*a+(z-cz)*b>ap)return false}return true};
function ok(x,z){if(OB.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+.4))return false;return ok0(x,z)}
function ok0(x,z){if(inHex(x,z,0,0,AP0-.3))return true;for(let k=0;k<6;k++){const [a,b]=DIR(k),u=x*a+z*b,v=x*b-z*a;if(u>AP0-1&&u<DD-AP1+1&&Math.abs(v)<1.6)return true;if(inHex(x,z,Z[k+1].x,Z[k+1].z,AP1-.3))return true}return false}

const HIT=[];function hitbox(o,u){const m=add(new THREE.CylinderGeometry(1.4,1.4,3.8,8),0xffffff,0,1.9,0,o);m.material.transparent=true;m.material.opacity=0;m.material.depthWrite=false;m.userData=u;HIT.push(m)}
hitbox(chair,{chair:1});
const NP=[],ENT=[me,chair];
G.forEach((g,gi)=>{const arr=LB[g.k]||[],z=Z[gi+1];arr.forEach((p,j)=>{const o=person(g.c,[0x2b1d14,0x3b2a20,0x1c1c1c][j%3]);let a=j/arr.length*6.283+.5;o.position.set(z.x,0,z.z);for(let k=0;k<80;k++){const rr=4.8+(k%5)*.6,x=z.x+Math.cos(a)*rr,y=z.z+Math.sin(a)*rr;if(inHex(x,y,z.x,z.z,AP1-1.5)&&free(x,y,o)){o.position.set(x,0,y);break}a+=.55}ENT.push(o);const nl=label(p.n,.55,6);nl.position.y=3.5;o.add(nl);hitbox(o,{p,gi});NP.push({o,z,ap:AP1,sp:2.2,wait:Math.random()*2,t:null,ph:0})})});
NP.push({o:chair,z:Z[0],ap:AP0,sp:2.6,wait:.5,t:null,ph:0,face:1});
function wander(w,dt){const o=w.o,z=w.z;
if(w.wait>0){w.wait-=dt;o.position.y=0;if(w.face)o.rotation.y=Math.atan2(me.position.x-o.position.x,me.position.z-o.position.z);if(w.wait<=0){let x,y,k=0;do{x=z.x+(Math.random()-.5)*2*w.ap;y=z.z+(Math.random()-.5)*2*w.ap;k++}while(k<40&&(!inHex(x,y,z.x,z.z,w.ap-1.5)||!ok(x,y)));w.t=[x,y]}return}
const ex=w.t[0]-o.position.x,ez=w.t[1]-o.position.z,d=Math.hypot(ex,ez);if(d<.3){w.wait=1.5+Math.random()*3;return}
const nx=o.position.x+ex/d*w.sp*dt,nz=o.position.z+ez/d*w.sp*dt;
if(free(nx,nz,o)){o.position.x=nx;o.position.z=nz;o.rotation.y=Math.atan2(ex,ez);w.ph+=dt*10;o.position.y=Math.abs(Math.sin(w.ph))*.2}else{w.wait=.25;w.face=w.face}}
// ---- control
let tgt=null,cur=null;
const ray=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),-.5);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},cam);const h=ray.intersectObjects(HIT,false)[0];if(h){const u=h.object.userData;lab(u.chair?CH:u.p,u.gi);return}const p=new THREE.Vector3();if(ray.ray.intersectPlane(pl,p)&&ok(p.x,p.z)){rp=0;stk=0;if(!setGoal(p.x,p.z))stopGo()}});

// ---- pathfinding (A* on a 0.5 grid, then line-of-sight smoothing)
const GS=.5,GO=42,GW=Math.round(GO*2/GS)+1;
let DYN=true;const wk=(x,z)=>ok(x,z)&&(!DYN||ENT.every(e=>e===me||Math.hypot(e.position.x-x,e.position.z-z)>1.1));
function los(a,b){const d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.ceil(d/.25);for(let i=1;i<=n;i++){const t=i/n;if(!wk(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t))return false}return true}
function findPath(sx,sz,gx,gz){
const cell=(x,z)=>[Math.round((x+GO)/GS),Math.round((z+GO)/GS)],pos=(i,j)=>[i*GS-GO,j*GS-GO];
const [si,sj]=cell(sx,sz),[gi,gj]=cell(gx,gz);if(!wk(gx,gz))return null;
if(los([sx,sz],[gx,gz]))return [[gx,gz]];
const key=(i,j)=>j*GW+i,g=new Map(),from=new Map(),H=[];
const push=(f,k)=>{H.push([f,k]);let i=H.length-1;while(i>0){const p=(i-1)>>1;if(H[p][0]<=H[i][0])break;[H[p],H[i]]=[H[i],H[p]];i=p}};
const pop=()=>{const t=H[0],l=H.pop();if(H.length){H[0]=l;let i=0;for(;;){let a=2*i+1,b=a+1,m=i;if(a<H.length&&H[a][0]<H[m][0])m=a;if(b<H.length&&H[b][0]<H[m][0])m=b;if(m==i)break;[H[m],H[i]]=[H[i],H[m]];i=m}}return t};
const hh=(i,j)=>{const dx=Math.abs(i-gi),dy=Math.abs(j-gj);return Math.max(dx,dy)+.414*Math.min(dx,dy)};
const sk=key(si,sj),gk=key(gi,gj);g.set(sk,0);push(hh(si,sj),sk);let it=0,found=false;
const ok2=(i,j)=>{if(i<0||j<0||i>=GW||j>=GW)return false;const [x,z]=pos(i,j);return wk(x,z)};
while(H.length&&it++<40000){const [,k]=pop(),i=k%GW,j=(k-i)/GW;if(k==gk){found=true;break}
for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(!di&&!dj)continue;const ni=i+di,nj=j+dj,nk=key(ni,nj);if(!ok2(ni,nj))continue;if(di&&dj&&(!ok2(i+di,j)||!ok2(i,j+dj)))continue;const c=g.get(k)+(di&&dj?1.414:1);if(!g.has(nk)||c<g.get(nk)){g.set(nk,c);from.set(nk,k);push(c+hh(ni,nj),nk)}}}
if(!found)return null;
let pts=[],k=gk;while(k!=sk){const i=k%GW,j=(k-i)/GW;pts.push(pos(i,j));k=from.get(k)}pts.reverse();pts[pts.length-1]=[gx,gz];
const out=[];let cur=[sx,sz],idx=0;while(idx<pts.length){let far=idx;for(let q=pts.length-1;q>idx;q--)if(los(cur,pts[q])){far=q;break}out.push(pts[far]);cur=pts[far];idx=far+1}
return out}
let PATH=[],GOAL=null,stk=0,rp=0;
function setGoal(x,z){DYN=true;let p=findPath(me.position.x,me.position.z,x,z);if(!p){DYN=false;p=findPath(me.position.x,me.position.z,x,z);DYN=true}if(!p)return false;GOAL=[x,z];PATH=p.map(a=>new THREE.Vector3(a[0],.5,a[1]));tgt=PATH.shift()||null;return true}
function stopGo(){tgt=null;PATH=[];GOAL=null;stk=0;rp=0}
function resize(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clk=new THREE.Clock();let ph=0;const cw={wait:.5,t:[0,0],ph:0};
function loop(){
const dt=Math.min(clk.getDelta(),.05);let dx=0,dz=0;
if(tgt){const v=tgt.clone().sub(me.position);v.y=0;if(v.length()<.4){tgt=PATH.shift()||null;if(!tgt)GOAL=null}else{dx=v.x;dz=v.z}}
const l=Math.hypot(dx,dz);let moved=false;
if(l>.01){dx/=l;dz/=l;const p=me.position,sx=p.x+dx*9*dt,sz=p.z+dz*9*dt;
if(free(sx,sz,me)){p.x=sx;p.z=sz;moved=true}else if(free(sx,p.z,me)){p.x=sx;moved=true}else if(free(p.x,sz,me)){p.z=sz;moved=true}
me.rotation.y=Math.atan2(dx,dz)}
if(tgt&&!moved){stk+=dt;if(stk>.5){stk=0;if(++rp>3||!GOAL||!setGoal(GOAL[0],GOAL[1]))stopGo()}}else if(moved)stk=0;
if(moved){ph+=dt*14;me.position.y=Math.abs(Math.sin(ph))*.25}else me.position.y=0;
lc.position.set(chair.position.x,4.6,chair.position.z);
NP.forEach(w=>wander(w,dt));
let hit=null;Z.forEach((z,n)=>{if(inHex(me.position.x,me.position.z,z.x,z.z,(n?AP1:AP0)-.8))hit=z});
if(hit!==cur){cur=hit;if(hit)enter(hit);else $('#where').textContent='🌉 橋上'}
const cx=me.position.x*.85,cz=me.position.z*.85;cam.position.lerp(new THREE.Vector3(cx,19,cz+20),.08);cam.lookAt(cx,0,cz-1);
ANIM.forEach(f=>f(clk.elapsedTime));R.render(S,cam);requestAnimationFrame(loop)}
function welcome(){$('#panel').innerHTML='<h2>歡迎來到蜂巢電機島</h2><div id="say">譚仕煒（系主任）導覽｜中間的六角形大島是必修課區，可以隨意走動，系主任也會在島上走動，點選他可以看他帶領的實驗室。六邊各有一座橋，通往六個組別的島嶼。</div><p class="note">直接點地面，小人就會走過去；各島上的老師也會四處走動，點選小人就能看他們的實驗室簡介。</p>'}
setAvatar();welcome();
loop();
</script>
